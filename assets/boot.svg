<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#000" opacity=".35"/>
    </pattern>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </radialGradient>
    <radialGradient id="bloom" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#ffb000" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="28" y="28" width="844" height="464" rx="18"/></clipPath>
    <clipPath id="logoClip">
      <rect x="0" y="84" width="900" height="0">
        <animate attributeName="height" from="0" to="100" begin="7.3s" dur=".8s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="typeClip">
      <rect x="210" y="384" width="0" height="24">
        <animate attributeName="width" from="0" to="240" begin="9.2s" dur="1.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    text{font-family:Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace;font-size:13px;fill:#ffb000}
    .dim{fill:#8a5a12}
    .hi{fill:#ffd27a}
    .ok{fill:#ffe9b8;font-weight:700}
    .logo{font-size:13px;fill:#ffb000}
    .es{fill:#fff1d0}
    .k{fill:#8a5a12}
  </style>

  <!-- monitor bezel -->
  <rect width="900" height="520" rx="26" fill="#17130e"/>
  <rect x="10" y="10" width="880" height="500" rx="24" fill="none" stroke="#2a231a" stroke-width="2"/>
  <rect x="28" y="28" width="844" height="464" rx="18" fill="#0c0702"/>

  <g clip-path="url(#screen)">
    <rect x="28" y="28" width="844" height="464" fill="url(#bloom)"/>

    <g filter="url(#glow)">
      <animate attributeName="opacity" values="1;.93;1;1;.97;1" dur="3.7s" repeatCount="indefinite"/>

      <!-- ================= BOOT LOG ================= -->
      <g>
        <set attributeName="opacity" to="0" begin="7s" fill="freeze"/>
        <text x="56" y="66" class="hi" opacity="0">hayrettinBIOS v2.6 · (C) 2024-2026 hayrettinES Systems<set attributeName="opacity" to="1" begin=".2s" fill="freeze"/></text>
        <text x="56" y="88" opacity="0"><tspan class="k">CPU  </tspan>Curiosity Core i∞ @ 3 cups of coffee / day<set attributeName="opacity" to="1" begin=".6s" fill="freeze"/></text>
        <text x="56" y="108" opacity="0"><tspan class="k">MEM  </tspan>16384K OK · 0 bytes wasted on boredom<set attributeName="opacity" to="1" begin="1s" fill="freeze"/></text>

        <text x="56" y="142" class="hi" opacity="0">Detecting senses...<set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/></text>

        <text x="56" y="166" opacity="0" xml:space="preserve">  /dev/eye0    SynthCheck · deepfake detector ...........<set attributeName="opacity" to="1" begin="1.8s" fill="freeze"/></text>
        <text x="700" y="166" class="ok" opacity="0">[  OK  ]<set attributeName="opacity" to="1" begin="2.2s" fill="freeze"/></text>
        <text x="56" y="186" opacity="0" xml:space="preserve">  /dev/sat0    remote sensing · earth from orbit ........<set attributeName="opacity" to="1" begin="2.4s" fill="freeze"/></text>
        <text x="700" y="186" class="ok" opacity="0">[  OK  ]<set attributeName="opacity" to="1" begin="2.8s" fill="freeze"/></text>
        <text x="56" y="206" opacity="0" xml:space="preserve">  /dev/vbox0   VirtualBox automation tool ...............<set attributeName="opacity" to="1" begin="3s" fill="freeze"/></text>
        <text x="700" y="206" class="ok" opacity="0">[  OK  ]<set attributeName="opacity" to="1" begin="3.4s" fill="freeze"/></text>
        <text x="56" y="226" opacity="0" xml:space="preserve">  /dev/web0    web apps · real-time chat ................<set attributeName="opacity" to="1" begin="3.6s" fill="freeze"/></text>
        <text x="700" y="226" class="ok" opacity="0">[  OK  ]<set attributeName="opacity" to="1" begin="4s" fill="freeze"/></text>
        <text x="56" y="246" opacity="0" xml:space="preserve">  /dev/game0   game worlds ..............................<set attributeName="opacity" to="1" begin="4.2s" fill="freeze"/></text>
        <text x="700" y="246" class="ok" opacity="0">[  OK  ]<set attributeName="opacity" to="1" begin="4.6s" fill="freeze"/></text>
        <text x="56" y="266" opacity="0" xml:space="preserve">  /dev/data0   big data lab cluster .....................<set attributeName="opacity" to="1" begin="4.8s" fill="freeze"/></text>
        <text x="700" y="266" class="ok" opacity="0">[  OK  ]<set attributeName="opacity" to="1" begin="5.2s" fill="freeze"/></text>

        <text x="56" y="302" opacity="0">Loading kernel module curiosity.ko<set attributeName="opacity" to="1" begin="5.4s" fill="freeze"/></text>
        <text x="700" y="302" class="ok" opacity="0">[  OK  ]<set attributeName="opacity" to="1" begin="5.7s" fill="freeze"/></text>
        <text x="56" y="330" class="hi" opacity="0">Starting hayrettinOS<set attributeName="opacity" to="1" begin="5.8s" fill="freeze"/></text>
        <g opacity="0">
          <set attributeName="opacity" to="1" begin="5.8s" fill="freeze"/>
          <rect x="56" y="344" width="420" height="14" fill="none" stroke="#ffb000"/>
          <rect x="59" y="347" width="0" height="8" fill="#ffb000">
            <animate attributeName="width" from="0" to="414" begin="5.9s" dur="1s" fill="freeze"/>
          </rect>
        </g>
      </g>

      <!-- screen flash on clear -->
      <rect x="28" y="28" width="844" height="464" fill="#ffd27a" opacity="0">
        <animate attributeName="opacity" values="0;.18;0" begin="7s" dur=".35s" fill="freeze"/>
      </rect>

      <!-- ================= DESKTOP ================= -->
      <g opacity="0">
        <set attributeName="opacity" to="1" begin="7.2s" fill="freeze"/>

        <!-- ASCII logo -->
        <g clip-path="url(#logoClip)">
          <text x="98" y="100" class="logo" textLength="704" lengthAdjust="spacingAndGlyphs" xml:space="preserve">██╗  ██╗ █████╗ ██╗   ██╗██████╗ ███████╗████████╗████████╗██╗███╗   ██╗<tspan class="es">███████╗███████╗</tspan></text>
          <text x="98" y="115" class="logo" textLength="704" lengthAdjust="spacingAndGlyphs" xml:space="preserve">██║  ██║██╔══██╗╚██╗ ██╔╝██╔══██╗██╔════╝╚══██╔══╝╚══██╔══╝██║████╗  ██║<tspan class="es">██╔════╝██╔════╝</tspan></text>
          <text x="98" y="130" class="logo" textLength="704" lengthAdjust="spacingAndGlyphs" xml:space="preserve">███████║███████║ ╚████╔╝ ██████╔╝█████╗     ██║      ██║   ██║██╔██╗ ██║<tspan class="es">█████╗  ███████╗</tspan></text>
          <text x="98" y="145" class="logo" textLength="704" lengthAdjust="spacingAndGlyphs" xml:space="preserve">██╔══██║██╔══██║  ╚██╔╝  ██╔══██╗██╔══╝     ██║      ██║   ██║██║╚██╗██║<tspan class="es">██╔══╝  ╚════██║</tspan></text>
          <text x="98" y="160" class="logo" textLength="704" lengthAdjust="spacingAndGlyphs" xml:space="preserve">██║  ██║██║  ██║   ██║   ██║  ██║███████╗   ██║      ██║   ██║██║ ╚████║<tspan class="es">███████╗███████║</tspan></text>
          <text x="98" y="175" class="logo" textLength="704" lengthAdjust="spacingAndGlyphs" xml:space="preserve">╚═╝  ╚═╝╚═╝  ╚═╝   ╚═╝   ╚═╝  ╚═╝╚══════╝   ╚═╝      ╚═╝   ╚═╝╚═╝  ╚═══╝<tspan class="es">╚══════╝╚══════╝</tspan></text>
        </g>

        <text x="450" y="210" text-anchor="middle" class="dim" xml:space="preserve">─────────  i give machines new senses, then build worlds for them  ─────────</text>

        <!-- neofetch-style info -->
        <g opacity="0">
          <set attributeName="opacity" to="1" begin="8s" fill="freeze"/>
          <text x="120" y="250"><tspan class="k">user   </tspan>hayrettinES</text>
          <text x="120" y="272"><tspan class="k">os     </tspan>hayrettinOS 2.6 (curious)</text>
          <text x="120" y="294"><tspan class="k">uptime </tspan>since 2024</text>
          <text x="120" y="316"><tspan class="k">pkgs   </tspan>16 public · more on the way</text>
          <text x="470" y="250"><tspan class="k">shell  </tspan>C# · Java · Python · JS</text>
          <text x="470" y="272"><tspan class="k">senses </tspan>vision · orbit · virtual · play</text>
          <text x="470" y="294"><tspan class="k">ai     </tspan>edge models, fully offline</text>
          <text x="470" y="316"><tspan class="k">theme  </tspan>amber phosphor</text>
          <g>
            <rect x="120" y="334" width="22" height="12" fill="#3a2406"/><rect x="146" y="334" width="22" height="12" fill="#5c3a0a"/>
            <rect x="172" y="334" width="22" height="12" fill="#8a5a12"/><rect x="198" y="334" width="22" height="12" fill="#b87a14"/>
            <rect x="224" y="334" width="22" height="12" fill="#ffb000"/><rect x="250" y="334" width="22" height="12" fill="#ffc94d"/>
            <rect x="276" y="334" width="22" height="12" fill="#ffd27a"/><rect x="302" y="334" width="22" height="12" fill="#fff1d0"/>
          </g>
        </g>

        <!-- prompt -->
        <g opacity="0">
          <set attributeName="opacity" to="1" begin="8.8s" fill="freeze"/>
          <text x="98" y="402" class="hi">hayrettin@ES:~$</text>
          <g clip-path="url(#typeClip)">
            <text x="213" y="402" xml:space="preserve">./explore --everything --slowly</text>
          </g>
          <rect x="213" y="390" width="9" height="15" fill="#ffd27a" opacity="0">
            <set attributeName="x" to="442" begin="10.6s" fill="freeze"/>
            <animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="8.8s" repeatCount="indefinite"/>
          </rect>
        </g>

        <text x="450" y="466" text-anchor="middle" class="dim" opacity="0">↓  scroll to continue  ↓<animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="10.8s" repeatCount="indefinite"/></text>
      </g>
    </g>

    <!-- CRT overlays -->
    <rect x="28" y="28" width="844" height="464" fill="url(#scan)"/>
    <rect x="28" y="28" width="844" height="464" fill="url(#vig)"/>
    <rect x="28" y="28" width="844" height="60" fill="#ffd27a" opacity=".025">
      <animate attributeName="y" from="-60" to="492" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- power led -->
  <circle cx="852" cy="502" r="3" fill="#ffb000"><animate attributeName="opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
</svg>
