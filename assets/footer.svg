<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .09 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <style>
    .note{font-family:Georgia,serif;font-size:12px;font-style:italic;fill:#7a6b5b}
    .sig{fill:none;stroke:#d2462d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:sign 7s ease-in-out infinite}
    @keyframes sign{0%{stroke-dashoffset:900}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}
  </style>
  <rect width="900" height="130" rx="10" fill="#f3ecdf"/>
  <rect width="900" height="130" rx="10" fill="#f3ecdf" filter="url(#grain)"/>
  <rect x="14" y="14" width="872" height="102" fill="none" stroke="#2a2622" stroke-width="1.4"/>
  <rect x="20" y="20" width="860" height="90" fill="none" stroke="#2a2622" stroke-width=".5"/>

  <text x="48" y="58" class="note">These field notes are unfinished.</text>
  <text x="48" y="80" class="note">New specimens are catalogued on a schedule, not all at once.</text>

  <!-- an ink signature that writes itself -->
  <path class="sig" d="M560 78c8-30 22-38 20-14s-14 30-10 8 20-26 26-10-6 22 4 12 12-22 20-10-2 18 8 10 14-24 22-12-4 20 6 12 10-18 18-8 0 14 10 8 16-16 26-6c8 8 30 6 60-6"/>
  <text x="852" y="100" class="note" text-anchor="end" style="font-size:10px;font-style:normal;letter-spacing:3px">— hayrettinES</text>
</svg>
