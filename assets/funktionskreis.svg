<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .09 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 1L8 5L0 9" fill="none" stroke="#2a2622" stroke-width="1.4"/>
    </marker>
  </defs>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif;fill:#2a2622}
    .sc{font-family:Georgia,serif;font-size:11px;letter-spacing:3px;fill:#7a6b5b}
    .st{font-family:Georgia,serif;font-size:13px;letter-spacing:4px;font-weight:700;fill:#2a2622}
    .de{font-family:Georgia,serif;font-size:12px;font-style:italic;fill:#d2462d}
    .it{font-family:Georgia,serif;font-size:13.5px;fill:#2a2622}
    .note{font-family:Georgia,serif;font-size:10.5px;fill:#8a7a68}
    .loop{fill:none;stroke:#2a2622;stroke-width:1.3;stroke-dasharray:5 5;animation:flow 6s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-60}}
  </style>

  <rect width="900" height="500" rx="10" fill="#f3ecdf"/>
  <rect width="900" height="500" rx="10" fill="#f3ecdf" filter="url(#grain)"/>
  <rect x="14" y="14" width="872" height="472" fill="none" stroke="#2a2622" stroke-width="1.4"/>
  <rect x="20" y="20" width="860" height="460" fill="none" stroke="#2a2622" stroke-width=".5"/>
  <text x="42" y="48" class="sc">PLATE II.</text>
  <text x="858" y="48" class="sc" text-anchor="end">THE FUNCTIONAL CIRCLE</text>

  <!-- four arcs of the loop: sense -> model -> act -> share -> sense -->
  <path class="loop" marker-end="url(#arr)" d="M478 112 A140 140 0 0 1 588 222"/>
  <path class="loop" marker-end="url(#arr)" d="M588 278 A140 140 0 0 1 478 388"/>
  <path class="loop" marker-end="url(#arr)" d="M422 388 A140 140 0 0 1 312 278"/>
  <path class="loop" marker-end="url(#arr)" d="M312 222 A140 140 0 0 1 422 112"/>

  <!-- travelling signal -->
  <circle r="6" fill="#d2462d">
    <animateMotion dur="9s" repeatCount="indefinite" path="M450 110 A140 140 0 1 1 449.9 110"/>
  </circle>
  <circle r="12" fill="#d2462d" opacity=".18">
    <animateMotion dur="9s" repeatCount="indefinite" path="M450 110 A140 140 0 1 1 449.9 110"/>
  </circle>

  <!-- centre -->
  <text x="450" y="242" class="serif" text-anchor="middle" style="font-size:26px;font-style:italic">Funktionskreis</text>
  <text x="450" y="266" class="note" text-anchor="middle">every project closes the loop somewhere</text>

  <!-- stations -->
  <g text-anchor="middle">
    <rect x="395" y="98" width="110" height="24" fill="#f3ecdf"/>
    <text x="450" y="115" class="st">SENSE</text>
    <rect x="395" y="378" width="110" height="24" fill="#f3ecdf"/>
    <text x="450" y="395" class="st">ACT</text>
  </g>
  <rect x="560" y="238" width="100" height="24" fill="#f3ecdf"/>
  <text x="600" y="255" class="st" text-anchor="middle">MODEL</text>
  <rect x="240" y="238" width="100" height="24" fill="#f3ecdf"/>
  <text x="300" y="255" class="st" text-anchor="middle">SHARE</text>

  <!-- SENSE: above -->
  <g text-anchor="middle">
    <text x="450" y="66" class="de">Merkwelt · how machines perceive</text>
    <text x="450" y="86" class="it">deepfake detection · remote sensing · link forensics</text>
  </g>

  <!-- ACT: below -->
  <g text-anchor="middle">
    <text x="450" y="428" class="de">Wirkwelt · how machines reach back</text>
    <text x="450" y="448" class="it">a robotic arm (growing) · VirtualBox tooling · games</text>
  </g>

  <!-- MODEL: right -->
  <text x="676" y="206" class="de">Innenwelt · how they think</text>
  <text x="676" y="232" class="it">big data pipelines</text>
  <text x="676" y="252" class="it">trees, graphs &amp; stacks</text>
  <text x="676" y="272" class="it">edge AI models</text>

  <!-- SHARE: left -->
  <text x="224" y="206" class="de" text-anchor="end">Mitwelt · how they meet us</text>
  <text x="224" y="232" class="it" text-anchor="end">web apps &amp; sites</text>
  <text x="224" y="252" class="it" text-anchor="end">real-time chat</text>
  <text x="224" y="272" class="it" text-anchor="end">tracking &amp; commerce</text>

  <text x="42" y="470" class="note">Fig. 2. After J. von Uexküll's functional circle (1934), redrawn for silicon organisms.</text>
</svg>
